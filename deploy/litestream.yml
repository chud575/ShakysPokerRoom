# /etc/litestream.yml — continuous backup of the room database to DigitalOcean Spaces.
# Keys come from /etc/default/litestream:
#   LITESTREAM_ACCESS_KEY_ID=...   LITESTREAM_SECRET_ACCESS_KEY=...
dbs:
  - path: /var/lib/poker-room/room.db
    replicas:
      - type: s3
        bucket: SPACES_BUCKET_NAME
        path: poker-room
        endpoint: https://nyc3.digitaloceanspaces.com
        region: nyc3
        sync-interval: 1s
        snapshot-interval: 24h
        retention: 720h
